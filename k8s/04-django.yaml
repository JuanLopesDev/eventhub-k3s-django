apiVersion: apps/v1
kind: Deployment
metadata:
  name: django
  namespace: eventos
spec:
  replicas: 1
  selector:
    matchLabels:
      app: django
  template:
    metadata:
      labels:
        app: django
    spec:
      nodeSelector:
        workload: "true"
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z mysql-service 3306; do echo aguardando MySQL; sleep 2; done"]
      containers:
        - name: django
          image: juanlopess/eventos-django:1.0.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: mysql-service
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom: {secretKeyRef: {name: app-secrets, key: MYSQL_DATABASE}}
            - name: DB_USER
              valueFrom: {secretKeyRef: {name: app-secrets, key: MYSQL_USER}}
            - name: DB_PASSWORD
              valueFrom: {secretKeyRef: {name: app-secrets, key: MYSQL_PASSWORD}}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: app-secrets, key: SECRET_KEY}}
            - name: ALLOWED_HOSTS
              value: "*"
          readinessProbe:
            httpGet: {path: /health/, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: "100m", memory: "128Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: django-service
  namespace: eventos
spec:
  type: NodePort
  selector:
    app: django
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080

