{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Eventos{% endblock %} | EventHub</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'events:dashboard' %}"><span class="brand-mark">E</span><span>EventHub</span></a>
    <nav><a href="{% url 'events:list' %}">Eventos</a><a href="{% url 'events:contacts' %}">Contatos</a><a class="button small" href="{% url 'events:create' %}">+ Novo evento</a></nav>
  </header>
  <main>
    {% if messages %}{% for message in messages %}<div class="message {{ message.tags }}">✓ {{ message }}</div>{% endfor %}{% endif %}
    {% block content %}{% endblock %}
  </main>
  <footer><strong>EventHub</strong><span>Projeto acadêmico Django + K3s</span></footer>
</body>
</html>
