services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: eventos
      MYSQL_USER: eventos_user
      MYSQL_PASSWORD: eventos_password_local
      MYSQL_ROOT_PASSWORD: root_password_local
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: development-only-secret
      ALLOWED_HOSTS: localhost,127.0.0.1
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: eventos
      DB_USER: eventos_user
      DB_PASSWORD: eventos_password_local
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:

